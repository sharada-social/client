[package]
name = "sharada"
version = "1.1.0"
description = "Sharada Secure Messenger"
authors = ["Sharada Security Team"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "sharada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
